name: CT1741 DSP firmware
on:
  push:
    paths:
      - 'firmware/ct1741/**'
      - '.github/workflows/ct1741.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MCS-51 toolchain
        run: sudo apt-get update && sudo apt-get install -y sdcc
      - name: Test and build standalone DSP ROM
        run: |
          make -C firmware/ct1741 check
          make -C firmware/ct1741
          test "$(wc -c < firmware/ct1741/build/ct1741.bin)" -eq 8192
      - uses: actions/upload-artifact@v4
        with:
          name: ct1741-dsp
          path: |
            firmware/ct1741/build/ct1741.bin
            firmware/ct1741/build/ct1741.ihx
            firmware/ct1741/build/ct1741.mem
          if-no-files-found: error
