name: SeaBIOS smoke CI

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seabios-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out firmware
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            nasm \
            python3

      - name: Run PCX decoder tests
        run: sh scripts/test-pcx.sh

      - name: Check QEMU display mode handoff
        run: python3 scripts/test-qemu-display-mode.py

      - name: Verify SeaBIOS boot-menu F9 scancode and prompt
        run: python3 scripts/test-boot-menu-f9.py

      - name: Test laptop APM record validator
        run: |
          test_bin="$(mktemp)"
          trap 'rm -f "$test_bin"' EXIT
          cc -std=gnu11 -Wall -Wextra -Werror -Isrc -o "$test_bin" scripts/test-laptop-apm.c
          "$test_bin"

      - name: Build SeaBIOS
        run: make -j2

      - name: Verify BIOS image
        run: test -s out/bios.bin
