name: SeaBIOS smoke CI

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seabios-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out firmware
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            nasm \
            python3

      - name: Run PCX decoder tests
        run: sh scripts/test-pcx.sh

      - name: Build SeaBIOS
        run: make -j2

      - name: Verify BIOS image
        run: test -s out/bios.bin
