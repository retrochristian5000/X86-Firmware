name: SeaBIOS smoke CI

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seabios-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out firmware
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            nasm \
            libncurses-dev \
            pkg-config \
            python3 \
            qemu-system-x86

      - name: Build native menuconfig without a firmware compiler
        run: make CC=false HOSTCC=cc menuconfig-build

      - name: Verify Kconfig defaults and round trip
        run: |
          config="$(mktemp)"
          trap 'rm -f "$config" "$config.old"' EXIT
          make CC=false HOSTCC=cc KCONFIG_CONFIG="$config" olddefconfig
          grep -Fx "CONFIG_PNPBIOS=y" "$config"
          grep -Fx "# CONFIG_PNPBIOS_RUNTIME is not set" "$config"
          cp "$config" "$config.expected"
          trap 'rm -f "$config" "$config.old" "$config.expected"' EXIT
          make CC=false HOSTCC=cc KCONFIG_CONFIG="$config" olddefconfig
          cmp "$config" "$config.expected"

      - name: Run PCX decoder tests
        run: sh scripts/test-pcx.sh

      - name: Verify CGA palette and text border separation
        run: python3 scripts/test-cga-palette.py

      - name: Check QEMU display mode handoff
        run: python3 scripts/test-qemu-display-mode.py

      - name: Verify QEMU SeaBIOS memory reporting contract
        run: python3 scripts/test-memory-report.py

      - name: Verify SeaBIOS boot-menu F9 scancode and prompt
        run: python3 scripts/test-boot-menu-f9.py

      - name: Verify legacy disk bootloader handoff
        run: python3 scripts/test-boot-handoff.py

      - name: Verify El Torito CD-ROM bootloader handoff
        run: python3 scripts/test-cdrom-handoff.py

      - name: Verify ATAPI data and non-data transfer setup
        run: python3 scripts/test-atapi-transfer.py

      - name: Verify optical and floppy DMA buffer transfers
        run: python3 scripts/test-disk-buffers.py

      - name: Verify extra-stack bounds and stack usage reporting
        run: python3 scripts/test-stack-bounds.py

      - name: Test virtio-blk completion I/O without fixed polling delays
        run: python3 scripts/test-virtio-blk-io.py

      - name: Test laptop APM record validator
        run: |
          test_bin="$(mktemp)"
          trap 'rm -f "$test_bin"' EXIT
          cc -std=gnu11 -Wall -Wextra -Werror -Isrc -o "$test_bin" scripts/test-laptop-apm.c
          "$test_bin"

      - name: Run extended POST memory and E820 helper tests
        run: |
          cc -std=gnu11 -Wall -Wextra -Werror -Isrc -o /tmp/whp-post-selftest scripts/test-post-selftest.c
          /tmp/whp-post-selftest

      - name: Test TSC projection without freestanding 64-bit shift libcalls
        run: |
          test_bin="$(mktemp)"
          trap 'rm -f "$test_bin"' EXIT
          cc -std=c11 -Wall -Wextra -Werror -Isrc \
            -o "$test_bin" scripts/test-timer-shift.c
          "$test_bin"

      - name: Verify firmware layout and ROM size audit
        run: python3 scripts/test-layoutrom.py

      - name: Verify incremental firmware linking workflow
        run: python3 scripts/test-link-workflow.py

      - name: Verify CSM ABI packing boundaries
        run: cc -std=c11 -Wall -Wextra -Werror -Isrc -fsyntax-only scripts/test-legacybios-pack.c

      - name: Verify firmware declaration attributes
        run: |
          cc -std=gnu11 -Wall -Wextra -Werror -Wreturn-type \
            -Wignored-attributes -Isrc -fsyntax-only \
            scripts/test-util-attributes.c

      - name: Verify TPM CRB response capacity bounds
        run: |
          test_bin="$(mktemp)"
          trap 'rm -f "$test_bin"' EXIT
          cc -std=gnu11 -Wall -Wextra -Werror -Isrc \
            -o "$test_bin" scripts/test-tpm-crb-size.c
          "$test_bin"

      - name: Check standard C TPM event storage
        run: |
          test_bin="$(mktemp)"
          trap 'rm -f "$test_bin"' EXIT
          cc -std=c11 -Wall -Wextra -Werror -Isrc \
            -o "$test_bin" scripts/test-tpm-specid-storage.c
          "$test_bin"

      - name: Build SeaBIOS
        run: WHP_ROM_SIZE_REPORT=1 make -j2

      - name: Verify BIOS image
        run: test -s out/bios.bin

      - name: Verify DOS real-mode interrupt stack preservation
        run: python3 scripts/test-dos-stack.py --bios out/bios.bin
